<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-root"></div>

<div class="auth-shell">
  <div class="auth-card fade-in" id="forgotStep1">
    <div class="text-center mb-4">
      <div class="brand-logo mb-2" style="font-size:1.8rem;">Nexora</div>
      <h4 class="fw-bold mb-1">Forgot your password?</h4>
      <p class="text-secondary" style="font-size:0.9rem;">Enter your email and we'll help you reset it</p>
    </div>

    <form id="forgotForm">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="forgotEmail" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-brand w-100" id="forgotBtn">Send Reset Link</button>
    </form>

    <hr class="my-4">
    <p class="text-center text-secondary mb-0" style="font-size:0.9rem;">
      Remember your password? <a href="login.html" style="color:var(--accent); font-weight:600;">Sign in</a>
    </p>
  </div>

  <div class="auth-card fade-in d-none" id="forgotStep2">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock" style="font-size:2.5rem; color:var(--accent);"></i>
      <h4 class="fw-bold mt-3 mb-1">Reset Your Password</h4>
      <p class="text-secondary" style="font-size:0.9rem;">
        In a production app this token would be emailed to you. For this demo, it's shown below so you can complete the flow.
      </p>
      <div class="alert alert-info" style="font-size:0.8rem; word-break:break-all;" id="tokenDisplay"></div>
    </div>

    <form id="resetForm">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" id="newPassword" required minlength="6" placeholder="Minimum 6 characters">
      </div>
      <button type="submit" class="btn btn-brand w-100" id="resetBtn">Reset Password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
