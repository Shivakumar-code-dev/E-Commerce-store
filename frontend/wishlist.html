<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="navbar-root"></div>

<main class="container py-4">
  <h3 class="fw-bold mb-4">My Wishlist</h3>
  <div class="row g-4" id="wishlistGrid"></div>
</main>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
async function loadWishlist() {
  const grid = document.getElementById('wishlistGrid');
  grid.innerHTML = Array(4).fill(skeletonCardHtml()).join('');
  try {
    const { user } = await Api.get('/auth/profile');
    localStorage.setItem('user', JSON.stringify(user));
    if (!user.wishlist || user.wishlist.length === 0) {
      grid.innerHTML = `
        <div class="col-12 empty-state">
          <i class="bi bi-heart"></i>
          <h5>Your wishlist is empty</h5>
          <p class="text-muted">Save items you love by tapping the heart icon.</p>
          <a href="products.html" class="btn btn-brand mt-2">Explore Products</a>
        </div>`;
      return;
    }
    grid.innerHTML = user.wishlist.map(productCardHtml).join('');
  } catch (err) {
    grid.innerHTML = `<div class="col-12 text-center text-muted py-5">${err.message}</div>`;
  }
}
document.addEventListener('DOMContentLoaded', () => {
  renderNavbar('');
  renderFooter();
  if (Auth.requireAuth()) loadWishlist();
  hidePageLoader();
});
</script>
</body>
</html>
