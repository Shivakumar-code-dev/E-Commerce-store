<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All Products — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="navbar-root"></div>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-2 d-lg-none">
    <h4 class="fw-bold mb-0">Shop</h4>
    <button class="btn btn-outline-brand btn-sm" data-bs-toggle="offcanvas" data-bs-target="#filterOffcanvas">
      <i class="bi bi-sliders"></i> Filters
    </button>
  </div>

  <div class="row g-4">
    <!-- Sidebar Filters (desktop) -->
    <div class="col-lg-3 d-none d-lg-block">
      <div class="filter-panel">
        <div id="filterFormDesktop"></div>
      </div>
    </div>

    <!-- Offcanvas filters (mobile) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="filterOffcanvas">
      <div class="offcanvas-header">
        <h5 class="fw-bold">Filters</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body" id="filterFormMobile"></div>
    </div>

    <!-- Products grid -->
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
          <h3 class="fw-bold mb-0 d-none d-lg-block">All Products</h3>
          <small class="text-muted" id="resultCount">Loading products...</small>
        </div>
        <select class="form-select w-auto" id="sortSelect" onchange="onFilterChange()">
          <option value="newest">Newest</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
          <option value="popular">Most Popular</option>
        </select>
      </div>
      <div class="row g-4" id="productsGrid"></div>
      <nav class="mt-5" id="paginationNav"></nav>
    </div>
  </div>
</main>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/products.js"></script>
</body>
</html>
