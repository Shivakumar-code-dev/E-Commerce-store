<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="navbar-root"></div>

<main class="container py-4" id="productDetailRoot">
  <!-- Skeleton while loading -->
  <div class="row g-5" id="loadingSkeleton">
    <div class="col-lg-6"><div class="skeleton" style="width:100%; aspect-ratio:1/1; border-radius:20px;"></div></div>
    <div class="col-lg-6">
      <div class="skeleton skeleton-line" style="width:40%;"></div>
      <div class="skeleton skeleton-line" style="width:80%; height:32px; margin-top:16px;"></div>
      <div class="skeleton skeleton-line" style="width:30%;"></div>
      <div class="skeleton skeleton-line" style="width:60%; height:24px; margin-top:20px;"></div>
      <div class="skeleton skeleton-line" style="width:100%; height:100px; margin-top:20px;"></div>
    </div>
  </div>

  <div id="productContent" class="d-none"></div>

  <section class="py-5" id="relatedSection" style="display:none;">
    <h3 class="section-title">You may also like</h3>
    <div class="row g-4" id="relatedGrid"></div>
  </section>
</main>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/product-detail.js"></script>
</body>
</html>
