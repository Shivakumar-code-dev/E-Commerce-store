<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-root"></div>

<div class="auth-shell">
  <div class="auth-card fade-in">
    <div class="text-center mb-4">
      <div class="brand-logo mb-2" style="font-size:1.8rem;">Nexora</div>
      <h4 class="fw-bold mb-1">Create your account</h4>
      <p class="text-secondary" style="font-size:0.9rem;">Join Nexora for a premium shopping experience</p>
    </div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" required placeholder="John Doe">
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" required placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" required minlength="6" placeholder="Minimum 6 characters">
          <button type="button" class="input-group-text" style="cursor:pointer;" onclick="togglePasswordVisibility('password', this)"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" required placeholder="Re-enter password">
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="agreeTerms" required>
        <label class="form-check-label text-secondary" for="agreeTerms" style="font-size:0.85rem;">I agree to the Terms of Service and Privacy Policy</label>
      </div>
      <button type="submit" class="btn btn-brand w-100" id="registerBtn">Create Account</button>
    </form>

    <hr class="my-4">
    <p class="text-center text-secondary mb-0" style="font-size:0.9rem;">
      Already have an account? <a href="login.html" style="color:var(--accent); font-weight:600;">Sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
