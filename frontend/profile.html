<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="navbar-root"></div>

<main class="container py-4">
  <h3 class="fw-bold mb-4">My Profile</h3>
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card-solid rounded-xl p-4 text-center">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center"
             style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg, var(--accent), var(--indigo)); color:#fff; font-size:2rem; font-weight:700;" id="avatarInitial">
        </div>
        <h5 class="fw-bold mb-0" id="profileName">—</h5>
        <p class="text-secondary" id="profileEmail">—</p>
        <span class="status-pill status-delivered text-uppercase" id="profileRole">user</span>
      </div>
    </div>

    <div class="col-lg-8">
      <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-info">Personal Info</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-address">Addresses</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-password">Password</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-info">
          <div class="card-solid rounded-xl p-4">
            <form id="profileForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="profileNameInput">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email (cannot be changed)</label>
                  <input type="email" class="form-control" id="profileEmailInput" disabled>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="profilePhoneInput" placeholder="Your phone number">
                </div>
              </div>
              <button type="submit" class="btn btn-brand mt-4">Save Changes</button>
            </form>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-address">
          <div class="card-solid rounded-xl p-4 mb-3">
            <h6 class="fw-bold mb-3">Add New Address</h6>
            <form id="addressForm">
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" id="addrFullName" required></div>
                <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" id="addrPhone" required></div>
                <div class="col-12"><label class="form-label">Address Line 1</label><input class="form-control" id="addrLine1" required></div>
                <div class="col-12"><label class="form-label">Address Line 2</label><input class="form-control" id="addrLine2"></div>
                <div class="col-md-4"><label class="form-label">City</label><input class="form-control" id="addrCity" required></div>
                <div class="col-md-4"><label class="form-label">State</label><input class="form-control" id="addrState" required></div>
                <div class="col-md-4"><label class="form-label">Postal Code</label><input class="form-control" id="addrPostal" required></div>
              </div>
              <button type="submit" class="btn btn-brand mt-3">Add Address</button>
            </form>
          </div>
          <div id="addressesList"></div>
        </div>

        <div class="tab-pane fade" id="tab-password">
          <div class="card-solid rounded-xl p-4">
            <form id="passwordForm">
              <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPasswordInput" minlength="6" required>
              </div>
              <button type="submit" class="btn btn-brand">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
