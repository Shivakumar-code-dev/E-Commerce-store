<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-root"></div>

<div class="auth-shell">
  <div class="auth-card fade-in">
    <div class="text-center mb-4">
      <div class="brand-logo mb-2" style="font-size:1.8rem;">Nexora</div>
      <h4 class="fw-bold mb-1">Welcome back</h4>
      <p class="text-secondary" style="font-size:0.9rem;">Sign in to continue shopping</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" required placeholder="you@example.com">
      </div>
      <div class="mb-2">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" required placeholder="••••••••">
          <button type="button" class="input-group-text" style="cursor:pointer;" onclick="togglePasswordVisibility('password', this)"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="d-flex justify-content-end mb-3">
        <a href="forgot-password.html" class="text-decoration-none" style="font-size:0.85rem; color:var(--accent);">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-brand w-100" id="loginBtn">Sign In</button>
    </form>

    <div class="text-center mt-3">
      <small class="text-muted">Demo: admin@codealpha.com / Admin@12345</small>
    </div>

    <hr class="my-4">
    <p class="text-center text-secondary mb-0" style="font-size:0.9rem;">
      Don't have an account? <a href="register.html" style="color:var(--accent); font-weight:600;">Create one</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
