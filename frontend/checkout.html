<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="navbar-root"></div>

<main class="container py-4">
  <h3 class="fw-bold text-center mb-2">Checkout</h3>

  <div class="checkout-steps">
    <div class="step-item active" id="step1Indicator">
      <div class="step-circle">1</div><span class="step-label d-none d-sm-inline">Shipping</span>
    </div>
    <div class="step-line"></div>
    <div class="step-item" id="step2Indicator">
      <div class="step-circle">2</div><span class="step-label d-none d-sm-inline">Payment</span>
    </div>
    <div class="step-line"></div>
    <div class="step-item" id="step3Indicator">
      <div class="step-circle">3</div><span class="step-label d-none d-sm-inline">Review</span>
    </div>
  </div>

  <div class="row g-4 justify-content-center">
    <div class="col-lg-7">
      <!-- Step 1: Shipping Address -->
      <div id="stepShipping" class="card-solid rounded-xl p-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2 text-accent"></i>Shipping Address</h5>
        <form id="shippingForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" required pattern="[0-9]{10}" placeholder="10-digit number">
            </div>
            <div class="col-12">
              <label class="form-label">Address Line 1</label>
              <input type="text" class="form-control" id="addressLine1" required placeholder="House no., building, street">
            </div>
            <div class="col-12">
              <label class="form-label">Address Line 2 <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="addressLine2" placeholder="Landmark, area">
            </div>
            <div class="col-md-4">
              <label class="form-label">City</label>
              <input type="text" class="form-control" id="city" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">State</label>
              <input type="text" class="form-control" id="state" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Postal Code</label>
              <input type="text" class="form-control" id="postalCode" required pattern="[0-9]{6}" placeholder="6-digit PIN">
            </div>
          </div>
          <button type="submit" class="btn btn-brand w-100 mt-4">Continue to Payment <i class="bi bi-arrow-right ms-1"></i></button>
        </form>
      </div>

      <!-- Step 2: Payment -->
      <div id="stepPayment" class="card-solid rounded-xl p-4 d-none">
        <h5 class="fw-bold mb-3"><i class="bi bi-credit-card me-2 text-accent"></i>Payment Method</h5>
        <div class="d-flex flex-column gap-2 mb-4">
          <label class="card-solid rounded-lg p-3 d-flex align-items-center gap-3" style="cursor:pointer; border-radius:14px;">
            <input type="radio" name="paymentMethod" value="card" checked>
            <i class="bi bi-credit-card fs-5"></i>
            <div><strong>Credit / Debit Card</strong><br><small class="text-muted">Simulated secure payment</small></div>
          </label>
          <label class="card-solid rounded-lg p-3 d-flex align-items-center gap-3" style="cursor:pointer; border-radius:14px;">
            <input type="radio" name="paymentMethod" value="upi">
            <i class="bi bi-phone fs-5"></i>
            <div><strong>UPI</strong><br><small class="text-muted">Pay using any UPI app (simulated)</small></div>
          </label>
          <label class="card-solid rounded-lg p-3 d-flex align-items-center gap-3" style="cursor:pointer; border-radius:14px;">
            <input type="radio" name="paymentMethod" value="cod">
            <i class="bi bi-cash-coin fs-5"></i>
            <div><strong>Cash on Delivery</strong><br><small class="text-muted">Pay when your order arrives</small></div>
          </label>
        </div>

        <div id="cardFieldsSection">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Card Number</label>
              <input type="text" class="form-control" placeholder="4242 4242 4242 4242" maxlength="19" id="cardNumber">
            </div>
            <div class="col-6">
              <label class="form-label">Expiry</label>
              <input type="text" class="form-control" placeholder="MM/YY" id="cardExpiry">
            </div>
            <div class="col-6">
              <label class="form-label">CVV</label>
              <input type="text" class="form-control" placeholder="123" maxlength="3" id="cardCvv">
            </div>
          </div>
          <small class="text-muted d-block mt-2"><i class="bi bi-info-circle me-1"></i>This is a simulated payment for demo purposes — no real transaction occurs.</small>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button class="btn btn-outline-brand" onclick="goToStep(1)"><i class="bi bi-arrow-left"></i></button>
          <button class="btn btn-brand flex-grow-1" onclick="goToStep(3)">Review Order <i class="bi bi-arrow-right ms-1"></i></button>
        </div>
      </div>

      <!-- Step 3: Review -->
      <div id="stepReview" class="card-solid rounded-xl p-4 d-none">
        <h5 class="fw-bold mb-3"><i class="bi bi-check2-circle me-2 text-accent"></i>Review &amp; Place Order</h5>
        <div id="reviewShippingBox" class="mb-3"></div>
        <div id="reviewPaymentBox" class="mb-3"></div>
        <div id="reviewItemsBox"></div>
        <div class="d-flex gap-2 mt-4">
          <button class="btn btn-outline-brand" onclick="goToStep(2)"><i class="bi bi-arrow-left"></i></button>
          <button class="btn btn-brand flex-grow-1" id="placeOrderBtn" onclick="placeOrder()">
            <i class="bi bi-bag-check me-1"></i> Place Order
          </button>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="summary-card" id="checkoutSummary">
        <!-- injected -->
      </div>
    </div>
  </div>
</main>

<div id="footer-root"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
