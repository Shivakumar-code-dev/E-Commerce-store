<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Coupons — Nexora Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="admin-topbar-root"></div>

<div class="d-flex">
  <div id="admin-sidebar-root" style="width:240px; flex-shrink:0;"></div>
  <div class="admin-content flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1">Coupons</h3>
        <p class="text-secondary mb-0">Create and manage discount codes</p>
      </div>
      <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#couponModal" onclick="openCouponModal()">
        <i class="bi bi-plus-lg me-1"></i> Add Coupon
      </button>
    </div>

    <div class="card-solid rounded-xl p-0" style="overflow-x:auto;">
      <table class="table-modern mb-0">
        <thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Min. Purchase</th><th>Expires</th><th>Usage</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="adminCouponsTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="couponModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:20px; border:none;">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="couponModalTitle">Add Coupon</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="couponForm">
          <input type="hidden" id="couponId">
          <div class="mb-3">
            <label class="form-label">Coupon Code</label>
            <input type="text" class="form-control text-uppercase" id="couponCode" required placeholder="e.g. SAVE20">
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Discount Type</label>
              <select class="form-select" id="couponType">
                <option value="percentage">Percentage (%)</option>
                <option value="flat">Flat Amount (₹)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Discount Value</label>
              <input type="number" class="form-control" id="couponValue" required min="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">Minimum Purchase (₹)</label>
              <input type="number" class="form-control" id="couponMinPurchase" value="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">Max Discount (₹, optional)</label>
              <input type="number" class="form-control" id="couponMaxDiscount">
            </div>
            <div class="col-md-6">
              <label class="form-label">Expiry Date</label>
              <input type="date" class="form-control" id="couponExpiry" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Usage Limit</label>
              <input type="number" class="form-control" id="couponUsageLimit" value="1000">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-brand" onclick="saveCoupon()">Save Coupon</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/admin-coupons.js"></script>
</body>
</html>
