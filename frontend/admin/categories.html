<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Categories — Nexora Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="admin-topbar-root"></div>

<div class="d-flex">
  <div id="admin-sidebar-root" style="width:240px; flex-shrink:0;"></div>
  <div class="admin-content flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1">Categories</h3>
        <p class="text-secondary mb-0">Organize your product catalog</p>
      </div>
      <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#categoryModal" onclick="openCategoryModal()">
        <i class="bi bi-plus-lg me-1"></i> Add Category
      </button>
    </div>

    <div class="row g-4" id="categoriesAdminGrid"></div>
  </div>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:20px; border:none;">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="categoryModalTitle">Add Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="categoryForm">
          <input type="hidden" id="categoryId">
          <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input type="text" class="form-control" id="catName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="catDescription" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Bootstrap Icon Class</label>
            <input type="text" class="form-control" id="catIcon" placeholder="e.g. bi-laptop">
            <small class="text-muted">Browse icons at <a href="https://icons.getbootstrap.com" target="_blank">icons.getbootstrap.com</a></small>
          </div>
          <div class="mb-3">
            <label class="form-label">Category Image</label>
            <input type="file" class="form-control" id="catImage" accept="image/*">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-brand" id="saveCategoryBtn" onclick="saveCategory()">Save Category</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/admin-categories.js"></script>
</body>
</html>
