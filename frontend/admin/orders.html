<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Orders — Nexora Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="admin-topbar-root"></div>

<div class="d-flex">
  <div id="admin-sidebar-root" style="width:240px; flex-shrink:0;"></div>
  <div class="admin-content flex-grow-1">
    <h3 class="fw-bold mb-1">Orders</h3>
    <p class="text-secondary mb-4">Track and manage customer orders</p>

    <div class="card-solid rounded-xl p-3 mb-4">
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-brand btn-sm status-filter-btn active" data-status="">All</button>
        <button class="btn btn-outline-brand btn-sm status-filter-btn" data-status="pending">Pending</button>
        <button class="btn btn-outline-brand btn-sm status-filter-btn" data-status="processing">Processing</button>
        <button class="btn btn-outline-brand btn-sm status-filter-btn" data-status="shipped">Shipped</button>
        <button class="btn btn-outline-brand btn-sm status-filter-btn" data-status="out_for_delivery">Out for Delivery</button>
        <button class="btn btn-outline-brand btn-sm status-filter-btn" data-status="delivered">Delivered</button>
        <button class="btn btn-outline-brand btn-sm status-filter-btn" data-status="cancelled">Cancelled</button>
      </div>
    </div>

    <div class="card-solid rounded-xl p-0" style="overflow-x:auto;">
      <table class="table-modern mb-0">
        <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="adminOrdersTableBody"></tbody>
      </table>
    </div>
    <nav class="mt-4" id="adminOrdersPagination"></nav>
  </div>
</div>

<div class="modal fade" id="orderStatusModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:20px; border:none;">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Update Order Status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="statusOrderId">
        <div class="mb-3">
          <label class="form-label">New Status</label>
          <select class="form-select" id="newStatusSelect">
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="out_for_delivery">Out for Delivery</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Note (optional)</label>
          <input type="text" class="form-control" id="statusNote" placeholder="e.g. Shipped via BlueDart">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-brand" onclick="submitStatusUpdate()">Update Status</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/admin-orders.js"></script>
</body>
</html>
