<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users — Nexora Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="admin-topbar-root"></div>

<div class="d-flex">
  <div id="admin-sidebar-root" style="width:240px; flex-shrink:0;"></div>
  <div class="admin-content flex-grow-1">
    <h3 class="fw-bold mb-1">Users</h3>
    <p class="text-secondary mb-4">Manage customer accounts and permissions</p>

    <div class="card-solid rounded-xl p-3 mb-4">
      <input type="search" class="form-control" id="adminUserSearch" placeholder="Search by name or email..." oninput="loadAdminUsers()">
    </div>

    <div class="card-solid rounded-xl p-0" style="overflow-x:auto;">
      <table class="table-modern mb-0">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody id="adminUsersTableBody"></tbody>
      </table>
    </div>
    <nav class="mt-4" id="adminUsersPagination"></nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/admin-users.js"></script>
</body>
</html>
