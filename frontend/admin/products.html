<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products — Nexora Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="admin-topbar-root"></div>

<div class="d-flex">
  <div id="admin-sidebar-root" style="width:240px; flex-shrink:0;"></div>
  <div class="admin-content flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h3 class="fw-bold mb-1">Products</h3>
        <p class="text-secondary mb-0">Manage your product catalog</p>
      </div>
      <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#productModal" onclick="openProductModal()">
        <i class="bi bi-plus-lg me-1"></i> Add Product
      </button>
    </div>

    <div class="card-solid rounded-xl p-3 mb-4">
      <div class="row g-2">
        <div class="col-md-6">
          <input type="search" class="form-control" id="adminProductSearch" placeholder="Search products..." oninput="loadAdminProducts()">
        </div>
        <div class="col-md-4">
          <select class="form-select" id="adminCategoryFilter" onchange="loadAdminProducts()"><option value="">All Categories</option></select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-brand w-100" onclick="loadAdminProducts()"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
      </div>
    </div>

    <div class="card-solid rounded-xl p-0" style="overflow-x:auto;">
      <table class="table-modern mb-0">
        <thead>
          <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="adminProductsTableBody"></tbody>
      </table>
    </div>
    <nav class="mt-4" id="adminProductsPagination"></nav>
  </div>
</div>

<!-- Product Add/Edit Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content" style="border-radius:20px; border:none;">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="productModalTitle">Add Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Product Name</label>
              <input type="text" class="form-control" id="pName" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Brand</label>
              <input type="text" class="form-control" id="pBrand">
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="pDescription" rows="3" required></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Category</label>
              <select class="form-select" id="pCategory" required></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Price (₹)</label>
              <input type="number" class="form-control" id="pPrice" required min="0">
            </div>
            <div class="col-md-4">
              <label class="form-label">Discount Price (₹)</label>
              <input type="number" class="form-control" id="pDiscountPrice" min="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">Stock Quantity</label>
              <input type="number" class="form-control" id="pStock" required min="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">SKU</label>
              <input type="text" class="form-control" id="pSku">
            </div>
            <div class="col-12">
              <label class="form-label">Product Images</label>
              <input type="file" class="form-control" id="pImages" multiple accept="image/*">
              <small class="text-muted">Upload up to 6 images (jpeg, png, webp)</small>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="pFeatured">
                <label class="form-check-label" for="pFeatured">Mark as Featured Product</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-brand" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-brand" id="saveProductBtn" onclick="saveProduct()">Save Product</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/admin-products.js"></script>
</body>
</html>
