<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Nexora</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="page-loader"><div class="loader-ring"></div></div>
<div id="admin-topbar-root"></div>

<div class="d-flex">
  <div id="admin-sidebar-root" style="width:240px; flex-shrink:0;"></div>
  <div class="admin-content flex-grow-1">
    <h3 class="fw-bold mb-1">Dashboard</h3>
    <p class="text-secondary mb-4">Welcome back! Here's what's happening with your store today.</p>

    <div class="row g-4 mb-4" id="statsCards">
      <!-- injected -->
    </div>

    <div class="row g-4 mb-4">
      <div class="col-lg-8">
        <div class="card-solid rounded-xl p-4 h-100">
          <h6 class="fw-bold mb-3">Sales Trend (Last 7 Days)</h6>
          <canvas id="salesChart" height="110"></canvas>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card-solid rounded-xl p-4 h-100">
          <h6 class="fw-bold mb-3">Order Status Breakdown</h6>
          <canvas id="statusChart" height="200"></canvas>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card-solid rounded-xl p-4">
          <h6 class="fw-bold mb-3">Top Selling Products</h6>
          <div id="topProductsList"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card-solid rounded-xl p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">Recent Orders</h6>
            <a href="orders.html" class="btn-ghost">View all</a>
          </div>
          <div id="recentOrdersList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/admin-layout.js"></script>
<script src="../js/admin-dashboard.js"></script>
</body>
</html>
